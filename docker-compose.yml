services:
  postgres-dbv:
    image: pgvector/pgvector:pg17
    container_name: chat-dbv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dbv
      POSTGRES_PASSWORD: dbv_secret
      POSTGRES_DB: chatdbv
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dbv:/var/lib/postgresql/data
      - ./sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro

volumes:
  pgdata_dbv:
