name: CI — Mara v2.0 (API & PWA)

on:
  push:
    branches: [ main, develop, release, 'release/**', 'feat/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    name: Python API & RAG Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar suíte Pytest
        run: pytest -v

  frontend-build:
    name: Next.js TypeScript & Static PWA Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências Web
        run: npm ci

      - name: Verificar tipagem TypeScript
        run: npm run typecheck

      - name: Compilar exportação estática PWA
        run: npm run build
