name: CD — Deploy Produção (Infinito Soft)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy via SSH (Secrets Obrigatórios)
    runs-on: ubuntu-latest
    # Só executa no repositório oficial e quando iniciado por push direto na main ou disparo manual
    if: github.event_name != 'pull_request' && github.repository_owner == 'edmiltonmartins'
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DEPLOY_ROOT: ${{ secrets.DEPLOY_ROOT }}
    steps:
      - name: Verificar segredos de deploy
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_KEY" ]; then
            echo "Deploy ignorado: configure os secrets SSH_HOST, SSH_USER e SSH_PRIVATE_KEY no GitHub."
            exit 0
          fi

      - name: Checkout do código
        if: env.SSH_HOST != '' && env.SSH_KEY != ''
        uses: actions/checkout@v4

      - name: Publicar release na instância de produção
        if: env.SSH_HOST != '' && env.SSH_KEY != ''
        run: |
          TARGET_USER="${SSH_USER:-ubuntu}"
          TARGET_ROOT="${DEPLOY_ROOT:-/home/ubuntu/projetos-infinito}"

          mkdir -p ~/.ssh
          echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

          tar -czf /tmp/mara-release.tar.gz \
            --exclude='.git' \
            --exclude='.venv' \
            --exclude='data/*.sqlite' \
            --exclude='data/*.sqlite-journal' \
            --exclude='.env' \
            --exclude='web/node_modules' \
            --exclude='web/.next' \
            --exclude='web/out' \
            .

          scp -i ~/.ssh/id_rsa /tmp/mara-release.tar.gz "$TARGET_USER@$SSH_HOST:/tmp/mara-release.tar.gz"

          ssh -i ~/.ssh/id_rsa "$TARGET_USER@$SSH_HOST" << EOF
            set -e
            mkdir -p "$TARGET_ROOT/mara-dbv"
            tar -xzf /tmp/mara-release.tar.gz -C "$TARGET_ROOT/mara-dbv"
            rm -f /tmp/mara-release.tar.gz
            cd "$TARGET_ROOT/deploy"
            sudo docker compose up -d --build mara-app
            sudo docker compose restart gateway
          EOF
